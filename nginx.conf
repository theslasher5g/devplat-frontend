server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers -------------------------------------------------
    # `always` on every one of these: without it nginx omits the header on
    # error responses, and an error page is exactly where a clickjacking or
    # sniffing protection still needs to hold.
    #
    # The Content-Security-Policy is only this strict because the fonts are
    # self-hosted (see src/fonts.css). While they came from Google, any policy
    # would have had to allow fonts.googleapis.com and fonts.gstatic.com —
    # which is to say, allow a third-party origin to serve executable-adjacent
    # resources into every page.
    #
    #   connect-src   the API is a separate origin, so it must be named or every
    #                 request the dashboard makes is blocked.
    #   style-src     'unsafe-inline' is required, not laziness: React sets
    #                 style attributes directly (progress bars, chart widths)
    #                 and CSP has no way to allow those selectively.
    #   frame-ancestors  clickjacking. The dashboard has destructive one-click
    #                 actions (revoke token, delete team) worth framing.
    #   object-src/base-uri  closing two classic injection escapes that nothing
    #                 here needs.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.devplat.ch; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    # Cross-origin requests send the origin only, never the path. Password
    # reset, email verification and invite links carry their token in the query
    # string, and this is what keeps that token out of any Referer header.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Redundant with frame-ancestors for modern browsers, kept for old ones.
    add_header X-Frame-Options "DENY" always;
    # Nothing here uses a camera, microphone or location; say so rather than
    # leaving it to a future dependency to decide.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Self-hosted fonts are content-stable and referenced by a fixed path, so
    # they get the same long cache as the hashed assets below.
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # Static assets: long cache, filenames are content-hashed by Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    # woff2 is already compressed; gzipping it again only costs CPU.
}
